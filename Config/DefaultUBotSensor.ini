; Redirects from the legacy AgentSensorCore plugin to UBotSensor / UBotCore.
;
; This file is the single list of these redirects. The plugin manager loads it into the "UBotSensor"
; config branch while configuring enabled plugins (FPluginManager::ConfigureEnabledPlugins, layer
; {PLUGIN}/Config/Default{TYPE}.ini) and InitUObject then reads [CoreRedirects] from every GConfig
; file, so it is active before any asset loads. The test UBotSensor.Redirects.Resolve checks every line.
; Enabling the plugin at runtime without an editor restart does not load these redirects.

[CoreRedirects]

; Module rename. The specific class/struct/enum/object redirects below win over this one (higher match
; score). It covers what has no specific redirect: imports of the script package itself (for example the
; member parent of delegate pins) and the Default__ objects of the redirected classes, whose outer the
; class redirects alone leave in /Script/AgentSensorCore. Without it, old assets report a missing script
; package when they load.
+PackageRedirects=(OldName="/Script/AgentSensorCore",NewName="/Script/UBotSensor")

; Classes
+ClassRedirects=(OldName="/Script/AgentSensorCore.AgentSensorComponent",NewName="/Script/UBotSensor.UBotSensorComponent")
+ClassRedirects=(OldName="/Script/AgentSensorCore.AgentPoseSensorComponent",NewName="/Script/UBotSensor.UBotPoseSensorComponent")
+ClassRedirects=(OldName="/Script/AgentSensorCore.AgentImuSensorComponent",NewName="/Script/UBotSensor.UBotImuSensorComponent")
+ClassRedirects=(OldName="/Script/AgentSensorCore.AgentOdometrySensorComponent",NewName="/Script/UBotSensor.UBotOdometrySensorComponent")
+ClassRedirects=(OldName="/Script/AgentSensorCore.Agent2DLidarSensorComponent",NewName="/Script/UBotSensor.UBot2DLidarSensorComponent")
+ClassRedirects=(OldName="/Script/AgentSensorCore.Agent3DLidarSensorComponent",NewName="/Script/UBotSensor.UBot3DLidarSensorComponent")
+ClassRedirects=(OldName="/Script/AgentSensorCore.AgentCameraSensorComponent",NewName="/Script/UBotSensor.UBotCameraSensorComponent")
+ClassRedirects=(OldName="/Script/AgentSensorCore.AgentRgbCameraSensorComponent",NewName="/Script/UBotSensor.UBotRgbCameraSensorComponent")
+ClassRedirects=(OldName="/Script/AgentSensorCore.AgentDepthCameraSensorComponent",NewName="/Script/UBotSensor.UBotDepthCameraSensorComponent")
+ClassRedirects=(OldName="/Script/AgentSensorCore.AgentCameraCaptureCoordinatorComponent",NewName="/Script/UBotSensor.UBotCameraCaptureCoordinatorComponent")
+ClassRedirects=(OldName="/Script/AgentSensorCore.AgentCameraCaptureSubsystem",NewName="/Script/UBotSensor.UBotCameraCaptureSubsystem")
+ClassRedirects=(OldName="/Script/AgentSensorCore.Agent2DLidarFrame",NewName="/Script/UBotSensor.UBot2DLidarFrame")
+ClassRedirects=(OldName="/Script/AgentSensorCore.AgentPointCloudFrame",NewName="/Script/UBotSensor.UBotPointCloudFrame")
+ClassRedirects=(OldName="/Script/AgentSensorCore.AgentImageFrame",NewName="/Script/UBotSensor.UBotImageFrame")

; Structs (field names are unchanged, so no property redirects are needed)
+StructRedirects=(OldName="/Script/AgentSensorCore.AgentSensorFrameHeader",NewName="/Script/UBotCore.UBotFrameHeader")
+StructRedirects=(OldName="/Script/AgentSensorCore.AgentPoseSensorData",NewName="/Script/UBotSensor.UBotPoseSensorData")
+StructRedirects=(OldName="/Script/AgentSensorCore.AgentImuSensorData",NewName="/Script/UBotSensor.UBotImuSensorData")
+StructRedirects=(OldName="/Script/AgentSensorCore.AgentOdometrySensorData",NewName="/Script/UBotSensor.UBotOdometrySensorData")

; Enums (value names are unchanged; UEnum re-qualifies "EOld::Value" with the new enum name)
+EnumRedirects=(OldName="/Script/AgentSensorCore.EAgentSensorSampleStatus",NewName="/Script/UBotCore.EUBotSampleStatus")
+EnumRedirects=(OldName="/Script/AgentSensorCore.EAgentPoseReferenceFrame",NewName="/Script/UBotSensor.EUBotPoseReferenceFrame")
+EnumRedirects=(OldName="/Script/AgentSensorCore.EAgentImageEncoding",NewName="/Script/UBotSensor.EUBotImageEncoding")
+EnumRedirects=(OldName="/Script/AgentSensorCore.EAgentDepthPreviewMode",NewName="/Script/UBotSensor.EUBotDepthPreviewMode")

; Dynamic delegate signatures. They are UDelegateFunction objects whose outer is the script package
; (not a class), so the class redirects do not cover them, and the linker classifies an import of class
; DelegateFunction as Type_Object (FCoreRedirects::GetFlagsForTypeName), so FunctionRedirects would never
; match. Bound event nodes rebuild their signature from the redirected delegate property on load; these
; lines keep the serialized signature references (delegate properties compiled for Bind/Assign/Create
; Event nodes) resolvable.
+ObjectRedirects=(OldName="/Script/AgentSensorCore.AgentSensorSimpleEvent__DelegateSignature",NewName="/Script/UBotSensor.UBotSensorSimpleEvent__DelegateSignature")
+ObjectRedirects=(OldName="/Script/AgentSensorCore.AgentSensorSampledEvent__DelegateSignature",NewName="/Script/UBotSensor.UBotSensorSampledEvent__DelegateSignature")
+ObjectRedirects=(OldName="/Script/AgentSensorCore.AgentSensorErrorEvent__DelegateSignature",NewName="/Script/UBotSensor.UBotSensorErrorEvent__DelegateSignature")
+ObjectRedirects=(OldName="/Script/AgentSensorCore.AgentPoseDataEvent__DelegateSignature",NewName="/Script/UBotSensor.UBotPoseDataEvent__DelegateSignature")
+ObjectRedirects=(OldName="/Script/AgentSensorCore.AgentImuDataEvent__DelegateSignature",NewName="/Script/UBotSensor.UBotImuDataEvent__DelegateSignature")
+ObjectRedirects=(OldName="/Script/AgentSensorCore.AgentOdometryDataEvent__DelegateSignature",NewName="/Script/UBotSensor.UBotOdometryDataEvent__DelegateSignature")
+ObjectRedirects=(OldName="/Script/AgentSensorCore.Agent2DLidarFrameEvent__DelegateSignature",NewName="/Script/UBotSensor.UBot2DLidarFrameEvent__DelegateSignature")
+ObjectRedirects=(OldName="/Script/AgentSensorCore.Agent3DLidarFrameEvent__DelegateSignature",NewName="/Script/UBotSensor.UBot3DLidarFrameEvent__DelegateSignature")
+ObjectRedirects=(OldName="/Script/AgentSensorCore.AgentImageFrameEvent__DelegateSignature",NewName="/Script/UBotSensor.UBotImageFrameEvent__DelegateSignature")
+ObjectRedirects=(OldName="/Script/AgentSensorCore.AgentCameraCaptureGroupErrorEvent__DelegateSignature",NewName="/Script/UBotSensor.UBotCameraCaptureGroupErrorEvent__DelegateSignature")

; Sensor meshes
+PackageRedirects=(OldName="/AgentSensorCore/Models/SM_AgentSensor_DepthCamera",NewName="/UBotSensor/Models/SM_UBotSensor_DepthCamera")
+ObjectRedirects=(OldName="/AgentSensorCore/Models/SM_AgentSensor_DepthCamera.SM_AgentSensor_DepthCamera",NewName="/UBotSensor/Models/SM_UBotSensor_DepthCamera.SM_UBotSensor_DepthCamera")
+PackageRedirects=(OldName="/AgentSensorCore/Models/SM_AgentSensor_IMU",NewName="/UBotSensor/Models/SM_UBotSensor_IMU")
+ObjectRedirects=(OldName="/AgentSensorCore/Models/SM_AgentSensor_IMU.SM_AgentSensor_IMU",NewName="/UBotSensor/Models/SM_UBotSensor_IMU.SM_UBotSensor_IMU")
+PackageRedirects=(OldName="/AgentSensorCore/Models/SM_AgentSensor_Lidar2D",NewName="/UBotSensor/Models/SM_UBotSensor_Lidar2D")
+ObjectRedirects=(OldName="/AgentSensorCore/Models/SM_AgentSensor_Lidar2D.SM_AgentSensor_Lidar2D",NewName="/UBotSensor/Models/SM_UBotSensor_Lidar2D.SM_UBotSensor_Lidar2D")
+PackageRedirects=(OldName="/AgentSensorCore/Models/SM_AgentSensor_Lidar3D",NewName="/UBotSensor/Models/SM_UBotSensor_Lidar3D")
+ObjectRedirects=(OldName="/AgentSensorCore/Models/SM_AgentSensor_Lidar3D.SM_AgentSensor_Lidar3D",NewName="/UBotSensor/Models/SM_UBotSensor_Lidar3D.SM_UBotSensor_Lidar3D")
+PackageRedirects=(OldName="/AgentSensorCore/Models/SM_AgentSensor_Odometry",NewName="/UBotSensor/Models/SM_UBotSensor_Odometry")
+ObjectRedirects=(OldName="/AgentSensorCore/Models/SM_AgentSensor_Odometry.SM_AgentSensor_Odometry",NewName="/UBotSensor/Models/SM_UBotSensor_Odometry.SM_UBotSensor_Odometry")
+PackageRedirects=(OldName="/AgentSensorCore/Models/SM_AgentSensor_Pose",NewName="/UBotSensor/Models/SM_UBotSensor_Pose")
+ObjectRedirects=(OldName="/AgentSensorCore/Models/SM_AgentSensor_Pose.SM_AgentSensor_Pose",NewName="/UBotSensor/Models/SM_UBotSensor_Pose.SM_UBotSensor_Pose")
+PackageRedirects=(OldName="/AgentSensorCore/Models/SM_AgentSensor_RGBCamera",NewName="/UBotSensor/Models/SM_UBotSensor_RGBCamera")
+ObjectRedirects=(OldName="/AgentSensorCore/Models/SM_AgentSensor_RGBCamera.SM_AgentSensor_RGBCamera",NewName="/UBotSensor/Models/SM_UBotSensor_RGBCamera.SM_UBotSensor_RGBCamera")
